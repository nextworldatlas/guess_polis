<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Guess Polis">
  <rect width="64" height="64" fill="#0e3a5f"/>

  <!-- Setback tower, drawn as one silhouette in Marker. -->
  <g fill="#ff8a3d">
    <rect x="14" y="34" width="8" height="24"/>
    <rect x="42" y="34" width="8" height="24"/>
    <rect x="24" y="16" width="16" height="42"/>
    <rect x="27" y="10" width="10" height="6"/>
    <rect x="30" y="6" width="4" height="4"/>
    <rect x="31.2" y="0.5" width="1.6" height="5.5"/>
  </g>

  <!-- Windows punched back through to the sheet. -->
  <g fill="#0e3a5f">
    <rect x="26.5" y="20" width="2.5" height="3"/>
    <rect x="30.75" y="20" width="2.5" height="3"/>
    <rect x="35" y="20" width="2.5" height="3"/>
    <rect x="26.5" y="26" width="2.5" height="3"/>
    <rect x="30.75" y="26" width="2.5" height="3"/>
    <rect x="35" y="26" width="2.5" height="3"/>
    <rect x="26.5" y="32" width="2.5" height="3"/>
    <rect x="30.75" y="32" width="2.5" height="3"/>
    <rect x="35" y="32" width="2.5" height="3"/>
    <rect x="26.5" y="38" width="2.5" height="3"/>
    <rect x="30.75" y="38" width="2.5" height="3"/>
    <rect x="35" y="38" width="2.5" height="3"/>
    <rect x="26.5" y="44" width="2.5" height="3"/>
    <rect x="30.75" y="44" width="2.5" height="3"/>
    <rect x="35" y="44" width="2.5" height="3"/>
    <rect x="17" y="38" width="2.5" height="3"/>
    <rect x="44.5" y="38" width="2.5" height="3"/>
    <rect x="17" y="44" width="2.5" height="3"/>
    <rect x="44.5" y="44" width="2.5" height="3"/>
  </g>

  <!-- Ground line, in Paper linework. -->
  <rect x="8" y="58" width="48" height="1.5" fill="#eaf4fb"/>
</svg>
