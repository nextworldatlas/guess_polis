<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Guess:Polis">
  <rect width="64" height="64" fill="#0e3a5f"/>

  <!-- Single setback tower, drawn as one silhouette in Marker. -->
  <g fill="#ff8a3d">
    <rect x="22" y="15" width="20" height="43"/>
    <rect x="26" y="9" width="12" height="6"/>
    <rect x="29.5" y="5" width="5" height="4"/>
    <rect x="31.2" y="1.5" width="1.6" height="3.5"/>
  </g>

  <!-- Windows punched back through to the sheet. -->
  <g fill="#0e3a5f">
    <rect x="25.5" y="18" width="3" height="3.5"/>
    <rect x="30.5" y="18" width="3" height="3.5"/>
    <rect x="35.5" y="18" width="3" height="3.5"/>
    <rect x="25.5" y="25" width="3" height="3.5"/>
    <rect x="30.5" y="25" width="3" height="3.5"/>
    <rect x="35.5" y="25" width="3" height="3.5"/>
    <rect x="25.5" y="32" width="3" height="3.5"/>
    <rect x="30.5" y="32" width="3" height="3.5"/>
    <rect x="35.5" y="32" width="3" height="3.5"/>
    <rect x="25.5" y="39" width="3" height="3.5"/>
    <rect x="30.5" y="39" width="3" height="3.5"/>
    <rect x="35.5" y="39" width="3" height="3.5"/>
    <rect x="25.5" y="46" width="3" height="3.5"/>
    <rect x="30.5" y="46" width="3" height="3.5"/>
    <rect x="35.5" y="46" width="3" height="3.5"/>
  </g>

  <!-- Ground line, in Paper linework. -->
  <rect x="12" y="58" width="40" height="1.5" fill="#eaf4fb"/>
</svg>
