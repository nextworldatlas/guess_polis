name: Build and publish

# Hostinger's git deploy can only pull static files - it cannot run a build.
# So this builds the site and force-pushes the result to the `deploy` branch,
# which is what Hostinger is pointed at. `main` stays pure source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Fail if the build dropped the Apache config
        run: test -f dist/.htaccess

      - name: Fail if any city image is missing from the build
        run: |
          referenced=$(grep -o '/cities/[A-Za-z_]*\.webp' dist/assets/*.js | sed 's|.*/cities/||' | sort -u)
          for f in $referenced; do
            test -f "dist/cities/$f" || { echo "missing: $f"; exit 1; }
          done
          echo "$(echo "$referenced" | wc -l) city images present"

      - name: Publish dist to the deploy branch
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA::7}"
          # Orphan history, force-pushed, so the deploy branch never accumulates
          # old build artifacts.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
